<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12385f" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>奔赴天津大学的每一天</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="hero-card" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow">天津大学考研 · 每日任务日志</p>
          <h1 id="page-title">奔赴天津大学的每一天</h1>
          <p class="hero-text">
            不必一次抵达终点。把今天的任务写下来、完成它、勾掉它，
            你就在把那个清晰的录取通知一点点拉近。
          </p>
          <div class="hero-date" data-today></div>
        </div>
        <div class="goal-card" aria-label="考研目标卡">
          <div class="sun-orbit"></div>
          <span class="goal-label">目标院校</span>
          <strong>天津大学</strong>
          <p>以热爱为锚，以行动为桨。</p>
        </div>
      </section>

      <section class="dashboard-grid" aria-label="学习记录面板">
        <article class="task-panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Today</p>
              <h2>每日任务</h2>
            </div>
            <p class="progress-number"><span data-progress-text>0%</span></p>
          </div>

          <div class="date-controls">
            <label>
              <span>查看学习日期</span>
              <input data-date-picker type="date" aria-label="选择学习记录日期" />
            </label>
            <button data-today-button type="button">回到今天</button>
          </div>
          <p class="viewing-date" data-viewing-date></p>

          <div class="progress-track" aria-label="今日任务完成进度">
            <div class="progress-bar" data-progress-bar></div>
          </div>

          <p class="completion-message" data-completion-message>
            从五项里先勾掉一项，让今天开始稳稳滚动起来。
          </p>

          <ul class="task-list" data-task-list></ul>
        </article>

        <aside class="stats-panel" aria-label="学习统计">
          <article class="political-tip-card">
            <span>考研政治小知识</span>
            <small data-political-tip-category></small>
            <strong data-political-tip-title></strong>
            <p data-political-tip-body></p>
            <div class="political-tip-actions">
              <button data-next-political-tip type="button">换一条</button>
              <button data-favorite-political-tip type="button" aria-pressed="false">收藏</button>
              <button data-toggle-favorites type="button" aria-expanded="false">查看收藏</button>
            </div>
            <div class="political-favorites" data-favorites-panel hidden>
              <strong>收藏的知识</strong>
              <ul data-favorites-list></ul>
              <p data-favorites-empty>还没有收藏，遇到重要知识时点一下“收藏”。</p>
            </div>
          </article>
          <div class="stat-card primary">
            <span>连续完成</span>
            <label class="stat-input-wrap">
              <input
                data-streak-input
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
                aria-label="输入连续完成天数"
              />
              <strong>天</strong>
            </label>
          </div>
          <div class="stat-card">
            <span>学习总天数</span>
            <label class="stat-input-wrap">
              <input
                data-study-days-input
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
                aria-label="输入学习总天数"
              />
              <strong>天</strong>
            </label>
          </div>
          <label class="reward-card">
            <span>今日奖励金额</span>
            <div class="reward-input-wrap">
              <span>￥</span>
              <input
                data-reward-input
                type="number"
                min="0"
                step="0.01"
                inputmode="decimal"
                placeholder="输入金额"
                aria-label="输入今日奖励金额"
              />
            </div>
            <div class="reward-total">
              <span>总金额</span>
              <div class="reward-total-input">
                <span>￥</span>
                <input
                  data-total-reward-input
                  type="number"
                  min="0"
                  step="0.01"
                  inputmode="decimal"
                  aria-label="输入总奖励金额"
                />
              </div>
            </div>
            <small>每天给自己一份看得见的奖励。</small>
          </label>
          <div class="stat-card">
            <span>今日完成</span>
            <strong><span data-completed-count>0</span>/<span data-total-count>0</span></strong>
          </div>
          <div class="quote-card">
            <span>每日一句</span>
            <p data-encouragement></p>
          </div>
        </aside>
      </section>
    </main>
  </body>
</html>
